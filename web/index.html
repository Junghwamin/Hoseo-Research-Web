<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연구실적 분석 포털</title>
    <meta
      name="description"
      content="대학알리미 전임교원 연구실적 공시자료로 1인당 SCI급·SCOPUS 논문 수와 순위를 전국·권역·비교군 안에서 확인하고 Word 보고서로 내려받는 도구"
    />
    <meta property="og:title" content="연구실적 분석 포털" />
    <meta
      property="og:description"
      content="대학알리미 전임교원 연구실적 공시자료로 1인당 SCI급·SCOPUS 논문 수와 순위를 전국·권역·비교군 안에서 확인하고 Word 보고서로 내려받는 도구"
    />
    <meta property="og:type" content="website" />
    <!-- 브라우저 크롬 색. 값은 tokens.css 의 --surface-base 와 같다(라이트 / 다크). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131316" />
    <!-- 번들 글꼴. JS 번들과 따로 받는다 — 글꼴 CSS 는 unicode-range 목록이라
         15KB(gzip) 나 되는데, 첫 화면 예산(초기 CSS 20KB)은 레이아웃 CSS 의 것이다. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
