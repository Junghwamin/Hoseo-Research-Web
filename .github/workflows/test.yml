name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 파이썬: core(ETL·통계·보고서) + api(계약)
  # ---------------------------------------------------------------------------
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Korean fonts for matplotlib
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          # matplotlib 폰트 캐시를 새로 만들어 findfont 경고를 줄인다
          rm -rf ~/.cache/matplotlib

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        env:
          MPLBACKEND: Agg
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        # live 마커는 실제 OpenAI API 를 호출하므로 CI 에서 제외한다.
        run: pytest -q -m "not live" -ra

  # ---------------------------------------------------------------------------
  # 프론트: 타입·단위·접근성·번들 예산
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit + a11y tests
        run: npm test

      # build 스크립트가 타입검사 → 빌드 → 번들 예산 검사까지 한다.
      # 예산을 넘으면 여기서 실패한다(설치본은 오프라인이라 CDN 으로 못 덜어낸다).
      - name: Build (번들 예산 포함)
        run: npm run build

      - name: Storybook build
        run: npm run build-storybook -- --quiet

  # ---------------------------------------------------------------------------
  # E2E: 실제 API 를 띄우고 브라우저로 관통
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      # playwright.config.ts 가 uvicorn 과 vite 를 둘 다 띄운다.
      # CI 에서는 venv 가 없으므로 시스템 python 을 쓰도록 바꿔 실행한다.
      - name: Run E2E
        working-directory: web
        env:
          CI: "true"
          PYTHON_BIN: python
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
